[package]
name = "forge-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
forge-core = { version = "0.1.0", path = "../forge-core" }
forge-scan = { version = "0.1.0", path = "../forge-scan" }
serde_json = "1.0.154"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
windows = { version = "0.62.2", features = ["Management_Deployment", "ApplicationModel", "Foundation", "Foundation_Collections"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Restore", "Win32_System_SystemInformation", "Win32_System_Threading"] }
