name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui

  windows:
    name: Windows build and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Test (Windows collectors and helper included)
        run: cargo test --workspace
      - name: Clippy (Windows code)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build the helper and stage it for bundling
        shell: pwsh
        run: |
          cargo build --release -p forge-helper
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item target/release/forge-helper.exe src-tauri/binaries/forge-helper-x86_64-pc-windows-msvc.exe

      - name: Build the UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build the installer
        run: node ui/node_modules/@tauri-apps/cli/tauri.js build

      - name: Smoke test the scanner on this runner
        shell: pwsh
        run: cargo run --release -p forge-scan --example dump_scan | Select-Object -First 40

      - uses: actions/upload-artifact@v4
        with:
          name: forge-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: forge-windows-installer
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
