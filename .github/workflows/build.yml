name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui

  windows:
    name: Windows build and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Test (Windows collectors and helper included)
        run: cargo test --workspace
      - name: Clippy (Windows code)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build the helper and stage it for bundling
        shell: pwsh
        run: |
          cargo build --release -p forge-helper
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item target/release/forge-helper.exe src-tauri/binaries/forge-helper-x86_64-pc-windows-msvc.exe

      - name: Build the UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build the installer
        run: node ui/node_modules/@tauri-apps/cli/tauri.js build

      - name: Smoke test the scanner on this runner
        shell: pwsh
        run: cargo run --release -p forge-scan --example dump_scan | Select-Object -First 40

      - uses: actions/upload-artifact@v4
        with:
          name: forge-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Keep the plain app for the Measure job
        uses: actions/upload-artifact@v4
        with:
          name: forge-windows-app
          path: |
            src-tauri/target/release/forge-app.exe
            target/release/forge-helper.exe
          if-no-files-found: error
          retention-days: 7

  measure:
    name: Measure (WebView2 vs native)
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/native-probe -> target
      - uses: actions/download-artifact@v4
        with:
          name: forge-windows-app
          path: app
      - name: Build the native probe
        run: cargo build --release --manifest-path tools/native-probe/Cargo.toml
      - name: Measure
        shell: pwsh
        run: |
          $exe = Get-ChildItem app -Recurse -Filter forge-app.exe | Select-Object -First 1
          $probe = "tools/native-probe/target/release/forge-native-probe.exe"
          New-Item -ItemType Directory -Force results | Out-Null
          $runs = @(
            @{ Label = "webview2";        Exe = $exe.FullName; Args = "" },
            @{ Label = "webview2-lean";   Exe = $exe.FullName; Args = "--renderer-process-limit=1 --disable-background-networking --disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection" },
            @{ Label = "webview2-no-gpu"; Exe = $exe.FullName; Args = "--disable-gpu" },
            @{ Label = "native-egui";     Exe = (Resolve-Path $probe).Path; Args = "" }
          )
          foreach ($r in $runs) {
            ./scripts/measure.ps1 -Exe $r.Exe -Label $r.Label -BrowserArgs $r.Args -Out "results/$($r.Label).json"
          }
      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $rows = Get-ChildItem results -Filter *.json | ForEach-Object { Get-Content $_ -Raw | ConvertFrom-Json }
          $md = @("## Forge idle cost on a GitHub Windows runner", "",
                  "No GPU on this machine (software rendering), so treat absolute numbers as indicative. Memory is private working set summed over the process tree.", "",
                  "| Setup | Cold start | Focused memory | Focused CPU | Minimized memory | Minimized CPU | Processes |",
                  "|---|---|---|---|---|---|---|")
          foreach ($r in $rows) {
            $md += "| $($r.label) | $($r.cold_start_ms) ms | $($r.focused.private_mb) MB | $($r.focused.cpu_pct)% | $($r.minimized.private_mb) MB | $($r.minimized.cpu_pct)% | $($r.focused.processes) |"
          }
          $md += ""
          foreach ($r in $rows) { $md += "- **$($r.label)**: $($r.focused.breakdown)" }
          $md += ""; $md += "Machine: $($rows[0].machine)"
          $md -join "`n" | Add-Content $env:GITHUB_STEP_SUMMARY
          $md -join "`n"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-measurements
          path: results

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, windows, measure]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: forge-windows-installer
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
